<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Tasks</title>
<style>
:root{--bg:#000;--ink:#f2f2f2;--dim:#7a7a7a;--line:#1c1c1c;--bd:#333;--mut:#555;--chip:#111;
  --pending:#9a9a9a;--running:#f5b942;--solved:#5ac8fa;--finished:#7ee0a0;--red:#ff6b6b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#fafafa;--ink:#111;--dim:#6a6a6a;--line:#e6e6e6;--bd:#cfcfcf;--mut:#999;--chip:#f0f0f0;
  --pending:#777;--running:#b7791f;--solved:#0a7cc2;--finished:#1f9d55;--red:#d93f3f}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;color-scheme:dark}
html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:960px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
h2 span{text-transform:none;letter-spacing:0;font-weight:400}
section{min-width:0}
h2[hidden]{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.ib{background:none;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.ib:hover,.ib[aria-pressed=true]{background:var(--chip)}
.ib[aria-pressed=true]{border-color:var(--ink)}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.srch{flex:1;min-width:140px;background:none;border:0;border-bottom:1px solid var(--bd);padding:8px 0;font-size:15px;border-radius:0;color:var(--ink)}
.srch:focus{outline:0;border-bottom-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.heat{display:flex;gap:3px;align-items:center}
.heat i{width:10px;height:10px;border-radius:2px;background:var(--finished)}
.tmr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:28px;font-size:13px;color:var(--dim)}
.tmr input{width:64px;background:var(--chip);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--ink)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border:1px solid var(--bd);border-radius:20px;padding:2px 4px 2px 10px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:40px;margin-top:56px}
@media(max-width:640px){.grid{grid-template-columns:1fr;margin-top:40px}}
input,button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
form{margin-bottom:12px}
.add{width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px 0;font-size:17px;border-radius:0}
.add::placeholder{color:var(--mut)}
.add:focus{border-bottom-color:var(--ink);outline:0}
ul{list-style:none;margin:0;padding:0}
li{padding:16px 0 16px 12px;border-bottom:1px solid var(--line)}
li.p-high{box-shadow:inset 2px 0 var(--red)}
li.p-low{box-shadow:inset 2px 0 var(--bd)}
li.drg{opacity:.4}li.ov{box-shadow:0 -2px var(--ink)}
.tpre{display:flex;gap:6px;margin-bottom:6px}
#tm{display:flex;flex-wrap:wrap;gap:24px 16px;justify-content:center;margin-top:16px}
#tm li.ring{position:relative;border:0;padding:0;width:150px;text-align:center}
#tm svg{width:100%;display:block;overflow:visible}
.rt{fill:none;stroke:var(--bd);stroke-width:5}
.rp{--g:var(--solved);fill:none;stroke:var(--g);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset 1s linear,stroke .6s}
.rp.end{--g:var(--red)}
.rx{fill:var(--ink);font-size:22px;text-anchor:middle;font-variant-numeric:tabular-nums}
.tb{display:flex;gap:6px;justify-content:center;margin-top:6px}
.fw{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;pointer-events:none;--fs:15px}
.clk{display:flex;justify-content:center;margin:4px 0 32px;--fs:clamp(30px,8vw,64px)}
.flip{display:flex;gap:.1em;align-items:center;font-size:var(--fs,48px);--h:1.5em;--w:.9em}
.fc{position:relative;width:var(--w);height:var(--h)}
.h{position:absolute;left:0;width:100%;height:calc(var(--h)/2);overflow:hidden;background:var(--chip);backface-visibility:hidden}
.t,.ft{top:0;border-radius:.1em .1em 0 0;border-bottom:1px solid var(--bg)}
.b,.fb{bottom:0;border-radius:0 0 .1em .1em}
.h i{position:absolute;left:0;width:100%;height:var(--h);line-height:var(--h);text-align:center;font-style:normal;font-weight:700;color:var(--ink)}
.t i,.ft i{top:0}
.b i,.fb i{bottom:0}
.ft,.fb{display:none;z-index:2}
.go .ft,.go .fb{display:block}
.ft{transform-origin:50% 100%}
.fb{transform-origin:50% 0}
.go .ft{animation:ft .28s ease-in both}
.go .fb{animation:fb .28s ease-out .28s both}
@keyframes ft{from{transform:perspective(300px) rotateX(0)}to{transform:perspective(300px) rotateX(-90deg)}}
@keyframes fb{from{transform:perspective(300px) rotateX(90deg)}to{transform:perspective(300px) rotateX(0)}}
.fcol{position:relative;width:.3em;height:var(--h)}
.fcol::before,.fcol::after{content:"";position:absolute;left:50%;width:.1em;height:.1em;border-radius:50%;background:var(--dim);transform:translateX(-50%)}
.fcol::before{top:36%}
.fcol::after{top:58%}
@media(prefers-reduced-motion:reduce){.ft,.fb{display:none!important}}

.tl{color:var(--dim);font-size:13px;min-height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px}
.hnd{cursor:grab;color:var(--mut);font-size:13px;user-select:none;letter-spacing:-2px;touch-action:none;padding:8px 2px}
.title{flex:1;min-width:0;background:none;border:0;padding:2px 0;font-size:17px}
li.done .title{color:var(--dim);text-decoration:line-through}
.del{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;width:28px;height:28px;line-height:1}
.del:hover{color:var(--ink)}
.streak{font-size:12px;color:var(--running);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--dim)}
.meta input,.meta select{background:var(--chip);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;font-size:12px;color:var(--ink);max-width:100%}
.meta .tag{width:84px}
.meta .over{color:var(--red);border-color:var(--red)}
.notes{width:100%;margin-top:8px;min-height:60px;background:var(--chip);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:14px;resize:vertical}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.status label{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;cursor:pointer}
.status label:has(input:checked){color:var(--c)}
.status input{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0;border:1.5px solid var(--bd);border-radius:50%;display:grid;place-content:center;cursor:pointer;background:none}
.status input::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .12s}
.status input:checked{border-color:var(--c)}
.status input:checked::before{transform:scale(1)}
.empty{padding:28px 0;color:var(--dim)}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:0;border:1.5px solid var(--bd);border-radius:5px;display:grid;place-content:center;cursor:pointer;background:none}
.chk::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--finished);transform:scale(0);transition:transform .12s}
.chk:checked{border-color:var(--finished)}
.chk:checked::before{transform:scale(1)}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:24px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 4px;font-size:22px}
dialog p{margin:0 0 18px;color:var(--dim);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .ib{padding:8px 14px}
#data textarea{width:100%;height:200px;background:var(--chip);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace;margin-bottom:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--chip);border:1px solid var(--bd);border-radius:10px;padding:8px 8px 8px 14px;font-size:14px;display:none;gap:12px;align-items:center;z-index:20}
@media(prefers-reduced-motion:reduce){.status input::before,.chk::before{transition:none}}
</style>
</head>
<body>
<main>
  <div class="hd">
    <h1>Tasks</h1>
    <div class="tools">
      <button class="ib" id="bell" type="button" aria-label="Enable alerts">🔔</button>
      <button class="ib" id="dat" type="button" aria-label="Export or import">⇅</button>
      <button class="ib" id="thm" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </div>
  <div class="clk" id="clk"></div>
  <div class="bar">
    <input id="q" class="srch" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
    <div class="tabs" id="tabs"></div>
    <div class="heat" id="heat" title="Completions, last 14 days"></div>
  </div>
  
  <section>
    <h2 hidden><span id="c-main"></span></h2>
    <form id="f">
      <input id="n" class="add" type="text" placeholder="Add a task" autocomplete="off" maxlength="140" aria-label="New task">
      
    </form>
    <ul id="list"></ul>
  </section>
  <div class="grid">
    <section>
      <h2>Daily <span id="c-daily"></span></h2>
      <form id="f-daily"><input class="add" type="text" placeholder="Add a daily task" autocomplete="off" maxlength="140" aria-label="New daily task">
        </form>
      <ul id="l-daily"></ul>
    </section>
    <section>
      <h2>Weekly <span id="c-weekly"></span></h2>
      <form id="f-weekly"><input class="add" type="text" placeholder="Add a weekly task" autocomplete="off" maxlength="140" aria-label="New weekly task">
        </form>
      <ul id="l-weekly"></ul>
    </section>
    <section>
      <h2>Timer</h2>
      <form id="f-timer"><input class="add" type="text" placeholder="Add a timer" autocomplete="off" maxlength="60" aria-label="New timer"></form>
      
      <ul id="tm"></ul>
    </section>
  </div>
</main>
<dialog id="al" aria-labelledby="al-t"><h3 id="al-t"></h3><p id="al-s"></p>
  <div class="acts"><button class="ib" id="al-done" type="button">Done</button><button class="ib" id="al-snz" type="button">Snooze 5 min</button><button class="ib" id="al-x" type="button">Dismiss</button></div></dialog>
<dialog id="data">
  <textarea id="data-t" aria-label="Backup data" spellcheck="false"></textarea>
  <div class="acts"><button class="ib" id="d-copy" type="button">Copy</button><button class="ib" id="d-imp" type="button">Import</button><button class="ib" id="d-x" type="button">Close</button></div>
  <p id="d-msg" style="margin:12px 0 0"></p></dialog>
<div id="toast" role="status"><span id="toast-m"></span><button class="ib" id="toast-u" type="button">Undo</button></div>
<script>
(function(){
var S=[["pending","Pending"],["running","Running"],["solved","Solved"],["finished","Finished"]];
var DAYS=[["0","Mon"],["1","Tue"],["2","Wed"],["3","Thu"],["4","Fri"],["5","Sat"],["6","Sun"]];
var KEY="tasks.app2",D,uid=0,flt="all",q="",drag=null,Q=[],cur=null,beepT,AC,tmKey="",tmEls={},toastT;
function $(i){return document.getElementById(i)}
function nid(){return Date.now()*100+(uid++%100)}
function ok(k){return S.some(function(s){return s[0]===k})}
function isDone(t){return t.status==="solved"||t.status==="finished"}
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function lt(d){return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function start(k,o){var d=new Date();d.setHours(0,0,0,0);if(k==="weekly")d.setDate(d.getDate()-((d.getDay()+6)%7)+7*(o||0));else d.setDate(d.getDate()+(o||0));return d}
function pk(k,o){return ymd(start(k,o))}
function sched(k,t){if(!t.time)return null;var d=start(k,0),p=t.time.split(":");if(k==="weekly")d.setDate(d.getDate()+t.wd);d.setHours(+p[0],+p[1]);return d}
function norm(d){
  d.tasks=(d.tasks||[]).map(function(t){return {id:t.id||nid(),title:String(t.title||""),status:ok(t.status)?t.status:"pending",due:t.due||"",pri:t.pri||"med",tag:t.tag||"",notes:t.notes||"",open:false,fired:!!t.fired}});
  ["daily","weekly"].forEach(function(k){d[k]=(d[k]||[]).map(function(t){return {id:t.id||nid(),title:String(t.title||""),done:t.done||"",time:t.time||"",wd:+t.wd||0,streak:t.streak||0,last:t.last||"",lf:t.lf||"",snz:t.snz||0}})});
  d.log=d.log||{};d.timers=d.timers||[];d.theme=d.theme||"";return d}
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.tasks))return norm(r)}catch(e){}
  var d={tasks:[],daily:[],weekly:[]};
  try{var a=JSON.parse(localStorage.getItem("tasks.simple"));if(Array.isArray(a))d.tasks=a}catch(e){}
  try{var b=JSON.parse(localStorage.getItem("tasks.recurring"));if(b){d.daily=b.daily||[];d.weekly=b.weekly||[]}}catch(e){}
  if(!d.tasks.length&&!d.daily.length&&!d.weekly.length){
    d.tasks=[{title:"Plan the week",status:"pending",pri:"high"},{title:"Build the landing page",status:"running"},{title:"Fix the login bug",status:"solved"},{title:"Send the report",status:"finished",pri:"low"}];
    d.daily=[{title:"Check emails"},{title:"Review open positions"}];d.weekly=[{title:"Weekly report"},{title:"Team sync"}]}
  return norm(d)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}drawHeat()}
function bump(n){var k=ymd(new Date());D.log[k]=Math.max(0,(D.log[k]||0)+n)}
function drawHeat(){var h=$("heat");h.textContent="";for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=ymd(d),n=D.log[k]||0,s=el("i");s.style.opacity=n?Math.min(1,.3+n*.2):.1;s.title=k+": "+n;h.appendChild(s)}}
/* alarms */
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function beep(){var c=ctx();if(!c)return;[0,.22,.44].forEach(function(o){var s=c.createOscillator(),g=c.createGain(),t=c.currentTime+o;s.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);s.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.18)})}
function notify(t){try{if("Notification" in window&&Notification.permission==="granted")new Notification("Reminder",{body:t})}catch(e){}}
function fire(a){Q.push(a);notify(a.title);if(!cur)next()}
function next(){
  cur=Q.shift();var m=$("al");clearInterval(beepT);
  if(!cur){document.title="Tasks";if(m.open)m.close();return}
  $("al-t").textContent=cur.title;$("al-s").textContent=cur.sub||"";$("al-done").style.display=cur.done?"":"none";$("al-snz").style.display=cur.snooze?"":"none";
  document.title="\u23f0 "+cur.title;if(!m.open)m.showModal();beep();beepT=setInterval(beep,2000)}
$("al-done").onclick=function(){if(cur.done)cur.done();next()};
$("al-snz").onclick=function(){if(cur.snooze)cur.snooze();next()};
$("al-x").onclick=next;$("al").oncancel=function(e){e.preventDefault();next()};
function setStatus(t,s){var w=isDone(t);t.status=s;if(isDone(t)&&!w)bump(1);if(w&&!isDone(t))bump(-1);save();render()}
function setRec(k,t,c){
  var p=pk(k,0);
  if(c){t.streak=(t.last===pk(k,-1))?t.streak+1:(t.last===p?t.streak:1);t.last=p;t.done=p;bump(1)}
  else{if(t.last===p){t.streak=Math.max(0,t.streak-1);t.last=t.streak?pk(k,-1):""}t.done="";bump(-1)}
  save();renderRec(k)}
function addTimer(m,label){D.timers.push({id:nid(),end:Date.now()+m*60000,total:m*60000,label:label||""});save();tmKey="";drawTimers()}
function tick(){
  var n=Date.now(),ch=false,fs=[];
  D.tasks.forEach(function(t){
    if(t.due&&!t.fired&&!isDone(t)&&+new Date(t.due)<=n){t.fired=true;ch=true;
      fs.push({title:t.title,done:function(){setStatus(t,"finished")},snooze:function(){t.due=lt(new Date(Date.now()+3e5));t.fired=false;save();render()}})}});
  ["daily","weekly"].forEach(function(k){var p=pk(k,0);D[k].forEach(function(t){
    if(t.done===p)return;var s=sched(k,t);
    if((t.snz&&n>=t.snz)||(s&&!t.snz&&t.lf!==p&&+s<=n)){t.lf=p;t.snz=0;ch=true;
      fs.push({title:t.title,done:function(){setRec(k,t,true)},snooze:function(){t.snz=Date.now()+3e5;save()}})}})});
  var left=D.timers.filter(function(x){if(!x.paused&&x.end<=n){ch=true;fs.push({title:x.label||"Time is up",snooze:function(){addTimer(5,x.label)}});return false}return true});
  if(left.length!==D.timers.length){D.timers=left;tmKey=""}
  if(fs.length>1)fire({title:fs.length+" alarms",sub:fs.map(function(a){return a.title}).join(", ")});else if(fs.length)fire(fs[0]);
  if(ch){save();render();renderRec("daily");renderRec("weekly")}
  drawTimers();var cd=new Date();clk.set(pad(cd.getHours())+":"+pad(cd.getMinutes())+":"+pad(cd.getSeconds()))}
var NS="http://www.w3.org/2000/svg",C=2*Math.PI*52;
function fmt(s){return (s>=3600?pad(Math.floor(s/3600))+":":"")+pad(Math.floor(s/60)%60)+":"+pad(s%60)}
function mkFlip(){
  var box=el("div","flip"),cards=[],len=0;
  function build(s){box.textContent="";cards=[];len=s.length;for(var i=0;i<s.length;i++){
    if(s[i]===":"){box.appendChild(el("span","fcol"));cards.push(null);continue}
    var c=el("div","fc");c.innerHTML="<div class=\"h t\"><i></i></div><div class=\"h b\"><i></i></div><div class=\"h ft\"><i></i></div><div class=\"h fb\"><i></i></div>";
    box.appendChild(c);cards.push(c)}}
  function put(c,i,d){c.children[i].firstChild.textContent=d}
  function flip(c,d){
    if(c._d===undefined){put(c,0,d);put(c,1,d);c._d=d;return}
    if(c._d===d)return;
    if(c._to){clearTimeout(c._to);put(c,1,c._d);c._to=0}
    put(c,2,c._d);put(c,3,d);put(c,0,d);c._d=d;
    c.classList.remove("go");void c.offsetWidth;c.classList.add("go");
    c._to=setTimeout(function(){put(c,1,d);c.classList.remove("go");c._to=0},580)}
  return {el:box,set:function(s){if(s.length!==len)build(s);for(var i=0;i<s.length;i++)if(cards[i])flip(cards[i],s[i])}}}
var clk=mkFlip();$("clk").appendChild(clk.el);
function sv(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function drawTimers(){
  var box=$("tm"),key="k"+D.timers.map(function(x){return x.id}).join();
